services:
  - type: web
    name: product-os
    runtime: node
    region: oregon
    plan: free
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.11.0
      - key: NEXT_PUBLIC_DOMAIN
        value: product-os.frederickli.pro
      - key: NEXT_PUBLIC_GA_MEASUREMENT_ID
        sync: false
      - key: NEXT_PUBLIC_CLARITY_PROJECT_ID
        sync: false
      - key: MONGODB_URI
        sync: false
